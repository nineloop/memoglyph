[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: test rapide, déterministe et sans I/O externe
    integration: test impliquant plusieurs modules ou un store local
    slow: test volontairement lent
    ml: test nécessitant un modèle local ou un service d'inférence
    sans_session: client de test sans la session fournie par tests/conftest.py
